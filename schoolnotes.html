<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchoolNotes — Gestão de Notas Escolares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Sora', sans-serif; background: #0f172a; color: #f1f5f9; }
  input, select, button, textarea { font-family: 'Sora', sans-serif; }
  input:focus, select:focus { outline: none; border-color: #6366f1 !important; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }
  input[type=number]::-webkit-inner-spin-button { opacity: 0.5; }
  * { transition: border-color 0.15s; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

// ============================================================
// CONSTANTS & CORE LOGIC
// ============================================================
const CONCEITOS = ["I","S","R","B","MB"];
const CONCEITO_ORDEM = {I:0,S:1,R:2,B:3,MB:4};

function percentToConceito(pct) {
  if (pct >= 95) return "MB";
  if (pct >= 80) return "B";
  if (pct >= 65) return "R";
  if (pct >= 50) return "S";
  return "I";
}
function conceitoColor(c) {
  return {I:"#ef4444",S:"#f97316",R:"#eab308",B:"#22c55e",MB:"#06b6d4"}[c] || "#94a3b8";
}

const MATERIAS_DEFAULT = ["Matemática","Português","Inglês","História","Geografia","Ciências","Física","Química","Biologia","Filosofia"];
const TRIMESTRES = ["1º Trimestre","2º Trimestre","3º Trimestre"];

// ============================================================
// MINI COMPONENTS
// ============================================================
function ConceitoTag({ conceito, size="md" }) {
  const sz = {sm:"text-xs",md:"",lg:"text-lg"}[size];
  const pad = {sm:"2px 8px",md:"4px 12px",lg:"6px 16px"}[size];
  const fs = {sm:11,md:13,lg:15}[size];
  return (
    <span style={{
      fontWeight:800, borderRadius:999, border:`1.5px solid ${conceitoColor(conceito)}50`,
      color:conceitoColor(conceito), background:conceitoColor(conceito)+"18",
      padding:pad, fontSize:fs, letterSpacing:"0.5px", display:"inline-block", lineHeight:1.6,
    }}>{conceito}</span>
  );
}

function ProgressArc({ conceito }) {
  const pcts = {I:12,S:35,R:58,B:80,MB:97};
  const pct = pcts[conceito]||0;
  const r = 28; const circ = 2*Math.PI*r;
  return (
    <svg width="72" height="72" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r={r} fill="none" stroke="#1e293b" strokeWidth="6"/>
      <circle cx="36" cy="36" r={r} fill="none" stroke={conceitoColor(conceito)} strokeWidth="6"
        strokeDasharray={`${circ*pct/100} ${circ}`} strokeLinecap="round"
        transform="rotate(-90 36 36)" style={{transition:"stroke-dasharray 0.7s ease"}}/>
      <text x="36" y="41" textAnchor="middle" fill={conceitoColor(conceito)} fontSize="14" fontWeight="800" fontFamily="Sora,sans-serif">{conceito}</text>
    </svg>
  );
}

function ProgressBar({ conceito }) {
  const pcts = {I:12,S:35,R:58,B:80,MB:97};
  const pct = pcts[conceito]||0;
  return (
    <div style={{flex:1,height:6,borderRadius:99,background:"#1e293b",overflow:"hidden"}}>
      <div style={{height:"100%",width:`${pct}%`,borderRadius:99,background:`linear-gradient(90deg,${conceitoColor(conceito)}99,${conceitoColor(conceito)})`,transition:"width 0.7s ease"}}/>
    </div>
  );
}

// ============================================================
// AUTH PAGE
// ============================================================
function AuthPage({ onLogin }) {
  const [tab, setTab] = useState("login");
  const [form, setForm] = useState({username:"",password:"",nome:""});
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  function handle() {
    setError("");
    if (!form.username.trim() || !form.password) { setError("Preencha todos os campos."); return; }
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      const users = JSON.parse(localStorage.getItem("sn_users")||"[]");
      if (tab==="login") {
        const u = users.find(u=>u.username===form.username&&u.password===form.password);
        if (!u) { setError("Usuário ou senha incorretos."); return; }
        onLogin(u);
      } else {
        if (users.find(u=>u.username===form.username)) { setError("Este nome de usuário já existe."); return; }
        const novo = {id:Date.now(),username:form.username.trim(),password:form.password,nome:form.nome||form.username.trim()};
        localStorage.setItem("sn_users",JSON.stringify([...users,novo]));
        onLogin(novo);
      }
    }, 500);
  }

  const iStyle = {
    width:"100%",padding:"11px 14px",borderRadius:10,border:"1.5px solid rgba(255,255,255,0.1)",
    background:"rgba(15,23,42,0.8)",color:"#f1f5f9",fontSize:14,outline:"none",
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%)",padding:"16px",position:"relative",overflow:"hidden"}}>
      {/* BG orbs */}
      {[[{bg:"#6366f1",t:5,l:5},{bg:"#8b5cf6",t:80,l:10},{bg:"#06b6d4",t:40,l:85},{bg:"#3b82f6",t:70,l:70}]].flat().map((o,i)=>(
        <div key={i} style={{position:"fixed",width:350,height:350,borderRadius:"50%",background:`radial-gradient(circle,${o.bg}22 0%,transparent 70%)`,top:`${o.t}%`,left:`${o.l}%`,transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
      ))}
      <div style={{width:"100%",maxWidth:400,position:"relative",zIndex:1}}>
        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:12,marginBottom:10}}>
            <div style={{width:48,height:48,borderRadius:14,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,boxShadow:"0 8px 20px #6366f150"}}>🎓</div>
            <span style={{fontSize:28,fontWeight:800,color:"#fff",letterSpacing:"-1px"}}>SchoolNotes</span>
          </div>
          <p style={{color:"#475569",fontSize:14}}>Acompanhe e compare seu desempenho</p>
        </div>

        <div style={{background:"rgba(30,41,59,0.8)",backdropFilter:"blur(20px)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:22,padding:32,boxShadow:"0 30px 60px rgba(0,0,0,0.5)"}}>
          {/* Tabs */}
          <div style={{display:"flex",background:"rgba(0,0,0,0.3)",borderRadius:12,padding:4,marginBottom:26,gap:4}}>
            {["login","register"].map(t=>(
              <button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:"9px 0",borderRadius:9,border:"none",cursor:"pointer",fontWeight:700,fontSize:14,fontFamily:"inherit",transition:"all 0.2s",background:tab===t?"linear-gradient(135deg,#6366f1,#8b5cf6)":"transparent",color:tab===t?"#fff":"#475569",boxShadow:tab===t?"0 2px 10px #6366f130":"none"}}>
                {t==="login"?"Entrar":"Criar Conta"}
              </button>
            ))}
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {tab==="register"&&<div>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",marginBottom:5,letterSpacing:"0.5px"}}>NOME COMPLETO</label>
              <input value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} placeholder="Seu nome completo" style={iStyle}/>
            </div>}
            <div>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",marginBottom:5,letterSpacing:"0.5px"}}>NOME DE USUÁRIO</label>
              <input value={form.username} onChange={e=>setForm({...form,username:e.target.value})} placeholder="seu_usuario" style={iStyle} autoComplete="username"/>
            </div>
            <div>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",marginBottom:5,letterSpacing:"0.5px"}}>SENHA</label>
              <input type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="••••••••" style={iStyle} autoComplete={tab==="login"?"current-password":"new-password"} onKeyDown={e=>e.key==="Enter"&&handle()}/>
            </div>
            {error&&<div style={{padding:"10px 14px",borderRadius:10,background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.25)",color:"#f87171",fontSize:13}}>{error}</div>}
            <button onClick={handle} disabled={loading} style={{padding:"13px",borderRadius:11,border:"none",cursor:loading?"default":"pointer",background:loading?"#334155":"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"#fff",fontWeight:700,fontSize:15,fontFamily:"inherit",marginTop:4,boxShadow:loading?"none":"0 4px 20px #6366f140",transition:"all 0.2s"}}>
              {loading?"⏳ Aguarde...":(tab==="login"?"Entrar →":"Criar Conta →")}
            </button>
          </div>

          <p style={{textAlign:"center",marginTop:18,fontSize:12,color:"#334155"}}>
            {tab==="login"?"Não tem conta? ":"Já tem conta? "}
            <span onClick={()=>setTab(tab==="login"?"register":"login")} style={{color:"#818cf8",cursor:"pointer",fontWeight:600}}>{tab==="login"?"Crie uma →":"Entrar →"}</span>
          </p>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// SHELL
// ============================================================
const NAV = [
  {id:"dashboard",icon:"⊞",label:"Dashboard"},
  {id:"provas",icon:"✏",label:"Provas"},
  {id:"simulados",icon:"⚗",label:"Simulados"},
  {id:"sas",icon:"📅",label:"SAS"},
  {id:"amigos",icon:"⟳",label:"Comparar"},
  {id:"config",icon:"◎",label:"Config"},
];

function Shell({ user, onLogout }) {
  const [page, setPage] = useState("dashboard");
  const [data, setData] = useState(()=>{
    try { const s = localStorage.getItem(`sn_data_${user.id}`); return s?JSON.parse(s):defData(); } catch{ return defData(); }
  });

  function defData() {
    return {provas:[],simulados:[],sas:[],config:{numSimulados:5,sasImpar:["Matemática","Português","Inglês","Física","Química"],sasPar:["História","Geografia","Ciências","Biologia","Filosofia"]},amigos:[]};
  }

  function saveData(nd) {
    setData(nd);
    localStorage.setItem(`sn_data_${user.id}`,JSON.stringify(nd));
  }

  return (
    <div style={{display:"flex",minHeight:"100vh",background:"#0a0f1e"}}>
      {/* Sidebar */}
      <aside style={{width:220,flexShrink:0,background:"rgba(15,23,42,0.95)",borderRight:"1px solid rgba(99,102,241,0.1)",display:"flex",flexDirection:"column",padding:"20px 10px",position:"fixed",top:0,bottom:0,left:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"4px 10px",marginBottom:28}}>
          <div style={{width:34,height:34,borderRadius:10,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,boxShadow:"0 4px 12px #6366f140"}}>🎓</div>
          <span style={{fontWeight:800,fontSize:15,color:"#fff",letterSpacing:"-0.3px"}}>SchoolNotes</span>
        </div>

        <nav style={{flex:1,display:"flex",flexDirection:"column",gap:2}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setPage(n.id)} style={{
              display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,border:"none",cursor:"pointer",fontFamily:"inherit",fontWeight:600,fontSize:13,textAlign:"left",transition:"all 0.15s",
              background:page===n.id?"rgba(99,102,241,0.15)":"transparent",
              color:page===n.id?"#a5b4fc":"#475569",
              borderLeft:page===n.id?"3px solid #6366f1":"3px solid transparent",
            }}>
              <span style={{fontSize:14,opacity:0.9}}>{n.icon}</span>{n.label}
            </button>
          ))}
        </nav>

        <div style={{borderTop:"1px solid rgba(255,255,255,0.05)",paddingTop:14}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",marginBottom:8}}>
            <div style={{width:30,height:30,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#fff",flexShrink:0}}>
              {(user.nome||user.username)[0].toUpperCase()}
            </div>
            <div style={{overflow:"hidden"}}>
              <p style={{fontSize:12,fontWeight:700,color:"#cbd5e1",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user.nome||user.username}</p>
              <p style={{fontSize:10,color:"#475569"}}>@{user.username}</p>
            </div>
          </div>
          <button onClick={onLogout} style={{width:"100%",padding:"8px",borderRadius:8,border:"1px solid rgba(239,68,68,0.2)",background:"rgba(239,68,68,0.05)",color:"#f87171",cursor:"pointer",fontFamily:"inherit",fontWeight:600,fontSize:12,transition:"all 0.15s"}}>
            Sair
          </button>
        </div>
      </aside>

      {/* Mobile bottom nav */}
      <nav style={{display:"none",position:"fixed",bottom:0,left:0,right:0,background:"rgba(15,23,42,0.97)",borderTop:"1px solid rgba(99,102,241,0.15)",padding:"8px 4px",zIndex:99,justifyContent:"space-around",backdropFilter:"blur(10px)"}} id="mob-nav">
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>setPage(n.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"4px 8px",background:"none",border:"none",cursor:"pointer",color:page===n.id?"#a5b4fc":"#475569",fontFamily:"inherit"}}>
            <span style={{fontSize:18}}>{n.icon}</span>
            <span style={{fontSize:9,fontWeight:700}}>{n.label}</span>
          </button>
        ))}
      </nav>

      {/* Content */}
      <main style={{flex:1,marginLeft:220,padding:"28px 24px",minHeight:"100vh"}} id="main-area">
        {page==="dashboard"&&<DashboardPage data={data} user={user}/>}
        {page==="provas"&&<ProvasPage data={data} saveData={saveData}/>}
        {page==="simulados"&&<SimuladosPage data={data} saveData={saveData}/>}
        {page==="sas"&&<SasPage data={data} saveData={saveData}/>}
        {page==="amigos"&&<AmigosPage data={data} saveData={saveData} user={user}/>}
        {page==="config"&&<ConfigPage data={data} saveData={saveData}/>}
      </main>

      <style>{`
        @media(max-width:768px){
          #main-area{margin-left:0!important;padding:14px!important;padding-bottom:76px!important;}
          aside{display:none!important;}
          #mob-nav{display:flex!important;}
        }
        button:hover{filter:brightness(1.1);}
        select option{background:#1e293b;color:#f1f5f9;}
      `}</style>
    </div>
  );
}

// ============================================================
// DASHBOARD
// ============================================================
function DashboardPage({ data, user }) {
  const { provas, simulados, sas } = data;

  function calcMedia(mat) {
    const all = [];
    provas.filter(p=>p.materia===mat).forEach(p=>all.push(CONCEITO_ORDEM[p.conceito]));
    simulados.filter(s=>s.materia===mat).forEach(s=>all.push(CONCEITO_ORDEM[percentToConceito(s.pct)]));
    const sasM = sas.filter(s=>s.materia===mat);
    if(sasM.length){const mp=sasM.reduce((a,b)=>a+b.pct,0)/sasM.length;all.push(CONCEITO_ORDEM[percentToConceito(mp)]);}
    if(!all.length)return null;
    return CONCEITOS[Math.round(all.reduce((a,b)=>a+b,0)/all.length)];
  }

  const stats = MATERIAS_DEFAULT.map(m=>({m,c:calcMedia(m)})).filter(s=>s.c);
  const mediaGeral = stats.length ? CONCEITOS[Math.round(stats.map(s=>CONCEITO_ORDEM[s.c]).reduce((a,b)=>a+b,0)/stats.length)] : null;
  const total = provas.length+simulados.length+sas.length;

  const recentes = [
    ...provas.map(p=>({...p,tipo:"Prova",cf:p.conceito})),
    ...simulados.map(s=>({...s,tipo:"Simulado",cf:percentToConceito(s.pct)})),
    ...sas.map(s=>({...s,tipo:"SAS",cf:percentToConceito(s.pct)})),
  ].slice(-6).reverse();

  return (
    <div>
      <div style={{marginBottom:26}}>
        <h1 style={{fontSize:24,fontWeight:800,color:"#fff",letterSpacing:"-0.5px"}}>Olá, {(user.nome||user.username).split(" ")[0]} 👋</h1>
        <p style={{color:"#475569",fontSize:13,marginTop:3}}>Aqui está o seu boletim digital.</p>
      </div>

      {/* KPI cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:14,marginBottom:24}}>
        {[
          {l:"Nota Geral",v:mediaGeral,icon:"🏆",type:"c"},
          {l:"Total de Notas",v:total,icon:"📋"},
          {l:"Matérias com Nota",v:stats.length,icon:"📚"},
          {l:"SAS Realizados",v:sas.length,icon:"📅"},
        ].map((k,i)=>(
          <div key={i} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:16,padding:"18px 16px",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:12,right:14,fontSize:20,opacity:0.4}}>{k.icon}</div>
            <p style={{fontSize:11,fontWeight:700,color:"#475569",marginBottom:8,letterSpacing:"0.5px"}}>{k.l.toUpperCase()}</p>
            {k.type==="c"&&k.v ? <ConceitoTag conceito={k.v} size="lg"/> : <p style={{fontSize:30,fontWeight:800,color:k.v?"#fff":"#334155"}}>{k.v??0}</p>}
          </div>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:18}}>
        {/* Subject grid */}
        <div style={{background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:18,padding:22}}>
          <h2 style={{fontSize:14,fontWeight:700,color:"#94a3b8",marginBottom:18,letterSpacing:"0.5px"}}>DESEMPENHO POR MATÉRIA</h2>
          {stats.length===0 ? (
            <div style={{textAlign:"center",padding:"32px 0",color:"#334155"}}>
              <p style={{fontSize:32,marginBottom:8}}>📚</p>
              <p style={{fontSize:13}}>Nenhuma nota registrada ainda.</p>
              <p style={{fontSize:12,marginTop:4,color:"#1e293b"}}>Use o menu lateral para começar!</p>
            </div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:11}}>
              {stats.map(({m,c})=>(
                <div key={m} style={{display:"flex",alignItems:"center",gap:12}}>
                  <span style={{width:108,fontSize:12,color:"#64748b",flexShrink:0,fontWeight:500}}>{m}</span>
                  <ProgressBar conceito={c}/>
                  <ConceitoTag conceito={c} size="sm"/>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Arcs */}
        <div style={{background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:18,padding:22}}>
          <h2 style={{fontSize:14,fontWeight:700,color:"#94a3b8",marginBottom:18,letterSpacing:"0.5px"}}>TOP MATÉRIAS</h2>
          {stats.length===0 ? (
            <div style={{textAlign:"center",padding:"32px 0",color:"#334155"}}><p style={{fontSize:13}}>Sem dados ainda.</p></div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:12,alignItems:"center"}}>
              {stats.sort((a,b)=>CONCEITO_ORDEM[b.c]-CONCEITO_ORDEM[a.c]).slice(0,4).map(({m,c})=>(
                <div key={m} style={{display:"flex",alignItems:"center",gap:12,width:"100%"}}>
                  <ProgressArc conceito={c}/>
                  <span style={{fontSize:12,color:"#64748b",fontWeight:500}}>{m}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Recent */}
      {recentes.length>0&&(
        <div style={{marginTop:18,background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:18,padding:22}}>
          <h2 style={{fontSize:14,fontWeight:700,color:"#94a3b8",marginBottom:14,letterSpacing:"0.5px"}}>LANÇAMENTOS RECENTES</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
            {recentes.map((n,i)=>(
              <div key={i} style={{padding:"12px 14px",background:"rgba(255,255,255,0.02)",borderRadius:12,border:"1px solid rgba(255,255,255,0.05)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{fontSize:10,fontWeight:700,color:"#6366f1",background:"#6366f115",padding:"2px 8px",borderRadius:6,letterSpacing:"0.5px"}}>{n.tipo}</span>
                  <ConceitoTag conceito={n.cf} size="sm"/>
                </div>
                <p style={{fontSize:13,fontWeight:600,color:"#cbd5e1"}}>{n.materia}</p>
                {n.trimestre&&<p style={{fontSize:11,color:"#334155",marginTop:2}}>{n.trimestre}</p>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// PROVAS
// ============================================================
function ProvasPage({ data, saveData }) {
  const [form, setForm] = useState({materia:MATERIAS_DEFAULT[0],trimestre:TRIMESTRES[0],conceito:"B"});
  const [ok, setOk] = useState(false);

  function add() {
    saveData({...data,provas:[...data.provas,{...form,id:Date.now()}]});
    setOk(true); setTimeout(()=>setOk(false),2000);
  }
  function del(id){saveData({...data,provas:data.provas.filter(p=>p.id!==id)});}

  return (
    <Page title="Provas Comuns" icon="✏️" desc="Registre o conceito obtido nas suas provas.">
      <TwoCol>
        <Card title="Nova Prova">
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <Field label="Matéria"><Sel value={form.materia} onChange={v=>setForm({...form,materia:v})} opts={MATERIAS_DEFAULT}/></Field>
            <Field label="Trimestre"><Sel value={form.trimestre} onChange={v=>setForm({...form,trimestre:v})} opts={TRIMESTRES}/></Field>
            <Field label="Conceito Obtido">
              <div style={{display:"flex",gap:8}}>
                {CONCEITOS.map(c=>(
                  <button key={c} onClick={()=>setForm({...form,conceito:c})} style={{
                    flex:1,padding:"10px 0",borderRadius:9,border:`2px solid ${form.conceito===c?conceitoColor(c):"rgba(255,255,255,0.08)"}`,
                    background:form.conceito===c?conceitoColor(c)+"20":"transparent",
                    color:form.conceito===c?conceitoColor(c):"#475569",
                    cursor:"pointer",fontWeight:800,fontSize:14,fontFamily:"inherit",
                  }}>{c}</button>
                ))}
              </div>
            </Field>
            <BtnPrimary onClick={add}>{ok?"✓ Salvo!":"Registrar Prova"}</BtnPrimary>
          </div>
        </Card>
        <Card title={`Provas Registradas (${data.provas.length})`}>
          {data.provas.length===0?<Empty/>:(
            <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:380,overflowY:"auto"}}>
              {[...data.provas].reverse().map(p=>(
                <NoteRow key={p.id} title={p.materia} sub={p.trimestre} conceito={p.conceito} onDel={()=>del(p.id)}/>
              ))}
            </div>
          )}
        </Card>
      </TwoCol>
    </Page>
  );
}

function SimuladosPage({ data, saveData }) {
  const [form, setForm] = useState({materia:MATERIAS_DEFAULT[0],trimestre:TRIMESTRES[0],acertos:"",total:""});
  const [ok,setOk]=useState(false);
  const pct = form.acertos&&form.total&&+form.total>0 ? Math.round((+form.acertos/+form.total)*100) : null;
  const c = pct!==null?percentToConceito(pct):null;

  function add(){
    if(pct===null)return;
    saveData({...data,simulados:[...data.simulados,{...form,acertos:+form.acertos,total:+form.total,pct,id:Date.now()}]});
    setForm({...form,acertos:"",total:""});
    setOk(true);setTimeout(()=>setOk(false),2000);
  }
  function del(id){saveData({...data,simulados:data.simulados.filter(s=>s.id!==id)});}

  return (
    <Page title="Simulados" icon="⚗️" desc="Insira seus acertos e veja o conceito calculado automaticamente.">
      <TwoCol>
        <Card title="Novo Simulado">
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <Field label="Matéria"><Sel value={form.materia} onChange={v=>setForm({...form,materia:v})} opts={MATERIAS_DEFAULT}/></Field>
            <Field label="Trimestre"><Sel value={form.trimestre} onChange={v=>setForm({...form,trimestre:v})} opts={TRIMESTRES}/></Field>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <Field label="Acertos"><Inp type="number" min="0" value={form.acertos} onChange={v=>setForm({...form,acertos:v})} placeholder="35"/></Field>
              <Field label="Total de Questões"><Inp type="number" min="1" value={form.total} onChange={v=>setForm({...form,total:v})} placeholder="45"/></Field>
            </div>
            {c&&(
              <div style={{padding:"14px 16px",borderRadius:12,background:conceitoColor(c)+"15",border:`1px solid ${conceitoColor(c)}30`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div>
                  <p style={{fontSize:11,color:"#64748b",marginBottom:3}}>RESULTADO</p>
                  <p style={{fontSize:22,fontWeight:800,color:"#fff"}}>{pct}%</p>
                </div>
                <ConceitoTag conceito={c} size="lg"/>
              </div>
            )}
            <BtnPrimary onClick={add} disabled={!c}>{ok?"✓ Salvo!":"Registrar Simulado"}</BtnPrimary>
          </div>
        </Card>
        <Card title={`Simulados Registrados (${data.simulados.length})`}>
          {data.simulados.length===0?<Empty/>:(
            <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:380,overflowY:"auto"}}>
              {[...data.simulados].reverse().map(s=>(
                <NoteRow key={s.id} title={s.materia} sub={`${s.trimestre} · ${s.acertos}/${s.total} (${s.pct}%)`} conceito={percentToConceito(s.pct)} onDel={()=>del(s.id)}/>
              ))}
            </div>
          )}
        </Card>
      </TwoCol>
    </Page>
  );
}

function SasPage({ data, saveData }) {
  const [sem, setSem] = useState("impar");
  const [form, setForm] = useState({});
  const [ok, setOk] = useState(false);
  const mats = sem==="impar" ? (data.config?.sasImpar||[]) : (data.config?.sasPar||[]);

  function add() {
    const novos = mats.map(mat=>{
      const ac=+(form[mat]??0);
      return {id:Date.now()+Math.random(),materia:mat,acertos:ac,total:4,pct:Math.round(ac/4*100),semana:sem,ts:Date.now()};
    });
    saveData({...data,sas:[...data.sas,...novos]});
    setForm({}); setOk(true); setTimeout(()=>setOk(false),2000);
  }

  const sasByMat = useMemo(()=>{
    const r = {};
    MATERIAS_DEFAULT.forEach(m=>{
      const rs=data.sas.filter(s=>s.materia===m);
      if(rs.length){const mp=Math.round(rs.reduce((a,b)=>a+b.pct,0)/rs.length);r[m]={mp,c:percentToConceito(mp),count:rs.length};}
    });
    return r;
  },[data.sas]);

  return (
    <Page title="SAS — Avaliação Semanal" icon="📅" desc="Registre seus acertos no SAS (0 a 4 questões por matéria).">
      <TwoCol>
        <Card title="Registrar SAS da Semana">
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <Field label="Tipo de Semana">
              <div style={{display:"flex",gap:8}}>
                {["impar","par"].map(s=>(
                  <button key={s} onClick={()=>setSem(s)} style={{
                    flex:1,padding:"9px 0",borderRadius:9,border:`2px solid ${sem===s?"#6366f1":"rgba(255,255,255,0.08)"}`,
                    background:sem===s?"#6366f120":"transparent",color:sem===s?"#a5b4fc":"#475569",
                    cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"inherit",
                  }}>Semana {s==="impar"?"Ímpar":"Par"}</button>
                ))}
              </div>
            </Field>
            {mats.length===0?(
              <p style={{color:"#475569",fontSize:13,padding:"10px 0"}}>⚠️ Configure as matérias do SAS nas Configurações.</p>
            ):mats.map(mat=>{
              const ac = form[mat]??null;
              const pct = ac!==null?Math.round(ac/4*100):null;
              return (
                <div key={mat} style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{flex:1,fontSize:12,color:"#64748b",fontWeight:500}}>{mat}</span>
                  <div style={{display:"flex",gap:5}}>
                    {[0,1,2,3,4].map(n=>(
                      <button key={n} onClick={()=>setForm({...form,[mat]:n})} style={{
                        width:32,height:32,borderRadius:8,border:`2px solid ${form[mat]===n?"#6366f1":"rgba(255,255,255,0.1)"}`,
                        background:form[mat]===n?"#6366f130":"rgba(255,255,255,0.02)",
                        color:form[mat]===n?"#a5b4fc":"#475569",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit",
                      }}>{n}</button>
                    ))}
                  </div>
                  {pct!==null&&<ConceitoTag conceito={percentToConceito(pct)} size="sm"/>}
                </div>
              );
            })}
            {mats.length>0&&<BtnPrimary onClick={add}>{ok?"✓ SAS Salvo!":"Registrar Semana"}</BtnPrimary>}
          </div>
        </Card>

        <Card title="Médias SAS por Matéria">
          {Object.keys(sasByMat).length===0?<Empty msg="Nenhum SAS registrado ainda."/>:(
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {Object.entries(sasByMat).map(([m,{mp,c,count}])=>(
                <div key={m} style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{width:108,fontSize:12,color:"#64748b",flexShrink:0}}>{m}</span>
                  <ProgressBar conceito={c}/>
                  <span style={{fontSize:10,color:"#334155",width:32,textAlign:"right",flexShrink:0}}>{mp}%</span>
                  <ConceitoTag conceito={c} size="sm"/>
                </div>
              ))}
            </div>
          )}
        </Card>
      </TwoCol>

      {data.sas.length>0&&(
        <div style={{marginTop:20}}>
          <Card title={`Histórico SAS (${data.sas.length} registros)`}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:8,maxHeight:260,overflowY:"auto"}}>
              {[...data.sas].reverse().slice(0,24).map((s,i)=>(
                <div key={i} style={{padding:"10px 12px",background:"rgba(255,255,255,0.02)",borderRadius:10,border:"1px solid rgba(255,255,255,0.05)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <p style={{fontSize:12,fontWeight:600,color:"#94a3b8"}}>{s.materia}</p>
                    <p style={{fontSize:10,color:"#334155"}}>{s.acertos}/4 · {s.semana==="impar"?"Ímpar":"Par"}</p>
                  </div>
                  <ConceitoTag conceito={percentToConceito(s.pct)} size="sm"/>
                </div>
              ))}
            </div>
          </Card>
        </div>
      )}
    </Page>
  );
}

// ============================================================
function AmigosPage({ data, saveData, user }) {
  const [q, setQ] = useState("");
  const [found, setFound] = useState(null);
  const [notFound, setNF] = useState(false);
  const [cmp, setCmp] = useState(null);

  function search() {
    setNF(false); setFound(null);
    const all = JSON.parse(localStorage.getItem("sn_users")||"[]");
    const u = all.find(u=>u.username===q.trim()&&u.id!==user.id);
    if(u)setFound(u); else setNF(true);
  }

  function addFriend() {
    if(!found||data.amigos.find(a=>a.id===found.id))return;
    saveData({...data,amigos:[...data.amigos,{id:found.id,username:found.username,nome:found.nome}]});
    setFound(null); setQ("");
  }

  function getFD(id){try{const d=localStorage.getItem(`sn_data_${id}`);return d?JSON.parse(d):{provas:[],simulados:[],sas:[]};}catch{return{provas:[],simulados:[],sas:[]};}}

  function getMedia(d,mat){
    const all=[];
    (d.provas||[]).filter(p=>p.materia===mat).forEach(p=>all.push(CONCEITO_ORDEM[p.conceito]));
    (d.simulados||[]).filter(s=>s.materia===mat).forEach(s=>all.push(CONCEITO_ORDEM[percentToConceito(s.pct)]));
    const sm=(d.sas||[]).filter(s=>s.materia===mat);
    if(sm.length){const mp=sm.reduce((a,b)=>a+b.pct,0)/sm.length;all.push(CONCEITO_ORDEM[percentToConceito(mp)]);}
    if(!all.length)return null;
    return CONCEITOS[Math.round(all.reduce((a,b)=>a+b,0)/all.length)];
  }

  const frd = cmp?getFD(cmp.id):null;

  return (
    <Page title="Amigos & Comparação" icon="👥" desc="Adicione amigos e compare seus boletins lado a lado.">
      <Card title="Buscar por @usuário" style={{marginBottom:20}}>
        <div style={{display:"flex",gap:10}}>
          <Inp value={q} onChange={setQ} placeholder="@username do seu amigo" onKeyDown={e=>e.key==="Enter"&&search()}/>
          <BtnPrimary onClick={search} style={{whiteSpace:"nowrap"}}>Buscar</BtnPrimary>
        </div>
        {notFound&&<p style={{color:"#ef4444",fontSize:13,marginTop:10}}>Usuário não encontrado.</p>}
        {found&&(
          <div style={{marginTop:14,padding:"12px 16px",background:"rgba(99,102,241,0.08)",border:"1px solid rgba(99,102,241,0.2)",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div>
              <p style={{color:"#e2e8f0",fontWeight:700,fontSize:14}}>{found.nome||found.username}</p>
              <p style={{color:"#64748b",fontSize:12}}>@{found.username}</p>
            </div>
            <BtnPrimary onClick={addFriend}>+ Adicionar</BtnPrimary>
          </div>
        )}
      </Card>

      <div style={{display:"grid",gridTemplateColumns:cmp?"1fr 2fr":"1fr",gap:20}}>
        <Card title={`Meus Amigos (${data.amigos.length})`}>
          {data.amigos.length===0?<Empty msg="Nenhum amigo ainda."/>:(
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {data.amigos.map(a=>(
                <div key={a.id} style={{
                  display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",borderRadius:11,
                  background:cmp?.id===a.id?"rgba(99,102,241,0.12)":"rgba(255,255,255,0.02)",
                  border:cmp?.id===a.id?"1px solid rgba(99,102,241,0.3)":"1px solid rgba(255,255,255,0.04)",
                }}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:28,height:28,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,color:"#fff",flexShrink:0}}>
                      {(a.nome||a.username)[0].toUpperCase()}
                    </div>
                    <div>
                      <p style={{fontSize:12,fontWeight:700,color:"#cbd5e1"}}>{a.nome||a.username}</p>
                      <p style={{fontSize:10,color:"#475569"}}>@{a.username}</p>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>setCmp(cmp?.id===a.id?null:a)} style={{padding:"4px 10px",borderRadius:7,border:"1px solid rgba(99,102,241,0.3)",background:"rgba(99,102,241,0.1)",color:"#a5b4fc",cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700}}>
                      {cmp?.id===a.id?"Fechar":"Comparar"}
                    </button>
                    <button onClick={()=>{saveData({...data,amigos:data.amigos.filter(f=>f.id!==a.id)});if(cmp?.id===a.id)setCmp(null);}} style={{background:"none",border:"none",cursor:"pointer",color:"#ef4444",fontSize:18,lineHeight:1}}>×</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </Card>

        {cmp&&frd&&(
          <Card title={`Comparação: Você vs ${(cmp.nome||cmp.username).split(" ")[0]}`}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,paddingBottom:12,borderBottom:"1px solid rgba(255,255,255,0.06)",marginBottom:8}}>
              <span style={{fontSize:10,fontWeight:700,color:"#475569",letterSpacing:"0.5px"}}>MATÉRIA</span>
              <span style={{fontSize:10,fontWeight:700,color:"#818cf8",textAlign:"center"}}>VOCÊ</span>
              <span style={{fontSize:10,fontWeight:700,color:"#f472b6",textAlign:"center"}}>{(cmp.nome||cmp.username).split(" ")[0].toUpperCase()}</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:360,overflowY:"auto"}}>
              {MATERIAS_DEFAULT.map(mat=>{
                const myC=getMedia(data,mat), frC=getMedia(frd,mat);
                if(!myC&&!frC)return null;
                const myO=myC?CONCEITO_ORDEM[myC]:-1, frO=frC?CONCEITO_ORDEM[frC]:-1;
                return (
                  <div key={mat} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,alignItems:"center",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.03)"}}>
                    <span style={{fontSize:12,color:"#64748b"}}>{mat}</span>
                    <div style={{textAlign:"center"}}>{myC?<ConceitoTag conceito={myC} size="sm"/>:<span style={{fontSize:11,color:"#334155"}}>—</span>}</div>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                      {frC?<ConceitoTag conceito={frC} size="sm"/>:<span style={{fontSize:11,color:"#334155"}}>—</span>}
                      {myC&&frC&&myO!==frO&&<span style={{fontSize:11}}>{myO>frO?"🟢":"🔴"}</span>}
                    </div>
                  </div>
                );
              }).filter(Boolean)}
            </div>
            <p style={{fontSize:10,color:"#334155",marginTop:12}}>🟢 = Você está melhor · 🔴 = Amigo está melhor</p>
          </Card>
        )}
      </div>
    </Page>
  );
}

function ConfigPage({ data, saveData }) {
  const [cfg, setCfg] = useState(()=>data.config||{numSimulados:5,sasImpar:["Matemática","Português","Inglês","Física","Química"],sasPar:["História","Geografia","Ciências","Biologia","Filosofia"]});
  const [ok,setOk]=useState(false);

  function toggle(key,mat){
    const cur=cfg[key]||[];
    setCfg({...cfg,[key]:cur.includes(mat)?cur.filter(m=>m!==mat):[...cur,mat]});
  }

  function save(){saveData({...data,config:cfg});setOk(true);setTimeout(()=>setOk(false),2000);}

  const MatGrid = ({ckey,color})=>(
    <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:14}}>
      {MATERIAS_DEFAULT.map(m=>{
        const sel=cfg[ckey]?.includes(m);
        return(
          <button key={m} onClick={()=>toggle(ckey,m)} style={{
            padding:"7px 13px",borderRadius:9,border:`1.5px solid ${sel?color:"rgba(255,255,255,0.08)"}`,
            background:sel?color+"20":"transparent",color:sel?color:"#475569",
            cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:600,
          }}>{m}</button>
        );
      })}
    </div>
  );

  return (
    <Page title="Configurações" icon="⚙️" desc="Configure o sistema de avaliação de acordo com sua série.">
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,marginBottom:20}}>
        <Card title="SAS — Semana Ímpar">
          <p style={{fontSize:12,color:"#475569"}}>Selecione as matérias avaliadas na semana ímpar.</p>
          <MatGrid ckey="sasImpar" color="#6366f1"/>
          <p style={{marginTop:10,fontSize:11,color:"#334155"}}>{cfg.sasImpar?.length||0} matérias selecionadas</p>
        </Card>
        <Card title="SAS — Semana Par">
          <p style={{fontSize:12,color:"#475569"}}>Selecione as matérias avaliadas na semana par.</p>
          <MatGrid ckey="sasPar" color="#8b5cf6"/>
          <p style={{marginTop:10,fontSize:11,color:"#334155"}}>{cfg.sasPar?.length||0} matérias selecionadas</p>
        </Card>
      </div>
      <Card title="Número de Simulados no Ano">
        <p style={{fontSize:12,color:"#475569",marginBottom:14}}>Selecione conforme sua série escolar.</p>
        <div style={{display:"flex",gap:12}}>
          {[3,5,6].map(n=>(
            <button key={n} onClick={()=>setCfg({...cfg,numSimulados:n})} style={{
              flex:1,padding:"16px 0",borderRadius:12,border:`2px solid ${cfg.numSimulados===n?"#6366f1":"rgba(255,255,255,0.08)"}`,
              background:cfg.numSimulados===n?"#6366f120":"transparent",
              color:cfg.numSimulados===n?"#a5b4fc":"#475569",
              cursor:"pointer",fontFamily:"inherit",fontWeight:800,fontSize:20,
            }}>{n}</button>
          ))}
        </div>
      </Card>
      <div style={{marginTop:16}}>
        <BtnPrimary onClick={save}>{ok?"✓ Configurações salvas!":"Salvar Configurações"}</BtnPrimary>
      </div>
    </Page>
  );
}

// ============================================================
// SHARED UI PRIMITIVES
// ============================================================
function Page({title,icon,desc,children}){
  return(
    <div>
      <div style={{marginBottom:22}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
          <span style={{fontSize:20}}>{icon}</span>
          <h1 style={{fontSize:22,fontWeight:800,color:"#fff",letterSpacing:"-0.5px"}}>{title}</h1>
        </div>
        <p style={{color:"#475569",fontSize:13}}>{desc}</p>
      </div>
      {children}
    </div>
  );
}
function Card({title,children,style={}}){
  return(
    <div style={{background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:18,padding:22,...style}}>
      {title&&<h3 style={{fontSize:14,fontWeight:700,color:"#94a3b8",marginBottom:18,letterSpacing:"0.5px"}}>{title.toUpperCase()}</h3>}
      {children}
    </div>
  );
}
function TwoCol({children}){return<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>{children}</div>;}
function Field({label,children}){return<div><label style={{display:"block",fontSize:10,fontWeight:700,color:"#475569",marginBottom:5,letterSpacing:"0.5px"}}>{label.toUpperCase()}</label>{children}</div>;}
function Sel({value,onChange,opts}){return<select value={value} onChange={e=>onChange(e.target.value)} style={{width:"100%",padding:"10px 12px",borderRadius:9,border:"1.5px solid rgba(255,255,255,0.08)",background:"#1e293b",color:"#f1f5f9",fontSize:13,fontFamily:"inherit",outline:"none"}}>{opts.map(o=><option key={o}>{o}</option>)}</select>;}
function Inp({value,onChange,placeholder,type="text",min,onKeyDown}){return<input type={type} min={min} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} onKeyDown={onKeyDown} style={{width:"100%",padding:"10px 12px",borderRadius:9,border:"1.5px solid rgba(255,255,255,0.08)",background:"#1e293b",color:"#f1f5f9",fontSize:13,fontFamily:"inherit",outline:"none"}}/>;}
function BtnPrimary({onClick,children,disabled,style={}}){return<button onClick={onClick} disabled={disabled} style={{padding:"11px 18px",borderRadius:10,border:"none",cursor:disabled?"default":"pointer",background:disabled?"#334155":"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"#fff",fontWeight:700,fontSize:13,fontFamily:"inherit",boxShadow:disabled?"none":"0 4px 16px #6366f130",transition:"all 0.15s",opacity:disabled?0.6:1,...style}}>{children}</button>;}
function Empty({msg="Nenhum dado registrado ainda."}){return<div style={{textAlign:"center",padding:"28px 0",color:"#334155"}}><p style={{fontSize:28,marginBottom:6}}>📭</p><p style={{fontSize:12}}>{msg}</p></div>;}
function NoteRow({title,sub,conceito,onDel}){
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:"rgba(255,255,255,0.02)",borderRadius:10,border:"1px solid rgba(255,255,255,0.04)"}}>
      <div>
        <p style={{fontSize:13,fontWeight:600,color:"#cbd5e1"}}>{title}</p>
        <p style={{fontSize:11,color:"#475569"}}>{sub}</p>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <ConceitoTag conceito={conceito} size="sm"/>
        <button onClick={onDel} style={{background:"none",border:"none",cursor:"pointer",color:"#ef4444",fontSize:18,lineHeight:1,padding:"0 2px"}}>×</button>
      </div>
    </div>
  );
}

// ============================================================
// ROOT APP
// ============================================================
function App(){
  const [user, setUser] = useState(()=>{
    try{const u=localStorage.getItem("sn_user");return u?JSON.parse(u):null;}catch{return null;}
  });
  function login(u){setUser(u);localStorage.setItem("sn_user",JSON.stringify(u));}
  function logout(){setUser(null);localStorage.removeItem("sn_user");}
  return user ? <Shell user={user} onLogout={logout}/> : <AuthPage onLogin={login}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
